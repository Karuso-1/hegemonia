<title>Hegemonía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&display=swap">

<style>
/* Layout: una mesa de juego de fieltro verde pino; el mapa ocupa la mesa y un panel lateral (abajo en móvil) lleva las órdenes. */
:root {
  --felt: #18301f;
  --felt-hi: #22432f;
  --sea: #1f3c2b;
  --grat: rgba(241, 232, 212, .06);
  --land: #3d5a47;
  --cream: #f1e8d4;
  --cream-dim: #bdb6a2;
  --ink: #16231a;
  --brass: #d8b462;
  --brass-ink: #2b220a;
  --line: rgba(241, 232, 212, .15);
  --card: rgba(9, 22, 14, .38);
  --danger: #e8846a;
  --p0: #c9432f; --p0-ink: #fff8ee;
  --p1: #2f64b4; --p1-ink: #fff8ee;
  --p2: #dca52d; --p2-ink: #22190a;
  --p3: #8253ad; --p3-ink: #fff8ee;
  --p4: #2a2d2f; --p4-ink: #f1e8d4;
  /* continentes: colores planos */
  --c-na: #e2c27a;
  --c-sa: #d98c6c;
  --c-eu: #93acd0;
  --c-af: #c7a0cf;
  --c-as: #a9c487;
  --c-oc: #7fc2b8;
  --font-display: "Big Shoulders Stencil Display", "Big Shoulders Stencil", Impact, "Arial Narrow", sans-serif;
  --font-num: "Big Shoulders Display", "Big Shoulders", "Arial Narrow", Impact, sans-serif;
  --font-body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html { box-sizing: border-box; height: 100%; background: var(--felt); }
*, *::before, *::after { box-sizing: inherit; }
body {
  min-height: 100%; background: var(--felt); color: var(--cream);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
}
body.ingame { height: 100%; overflow: hidden; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.1; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--cream-dim); font-weight: 600; }
.num { font-family: var(--font-num); font-weight: 800; font-variant-numeric: tabular-nums; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; font-weight: 600; font-size: 15px;
  transition: background .15s, transform .1s;
}
.btn:hover { background: rgba(241, 232, 212, .08); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); }
.btn.primary:hover { background: #e4c375; }
.btn.danger { color: var(--danger); border-color: rgba(232, 132, 106, .5); }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---------- Lobby ---------- */
#lobby {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
  display: grid; gap: 28px;
}
.hero { display: grid; gap: 14px; position: relative; }
.hero h1 {
  font-family: var(--font-display); font-weight: 800; font-size: clamp(56px, 13vw, 128px);
  letter-spacing: .01em; line-height: .86; color: var(--cream);
}
.hero h1 span { color: var(--brass); }
.hero p { max-width: 56ch; color: var(--cream-dim); margin: 0; font-size: 17px; }
.hero-map { width: 100%; max-width: 100%; height: auto; display: block; border-radius: 14px; background: radial-gradient(ellipse at 50% 45%, var(--felt-hi), var(--felt) 75%); }
.lobby-grid { display: grid; gap: 20px; grid-template-columns: 1fr; }
@media (min-width: 860px) { .lobby-grid { grid-template-columns: 380px 1fr; align-items: start; } }
.sheet { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
.sheet h2 { font-family: var(--font-num); font-weight: 800; font-size: 28px; letter-spacing: .02em; text-transform: uppercase; }
label.field { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
input[type=text] {
  min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.22);
  padding: 0 12px; font-size: 16px;
}
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch {
  width: 40px; height: 40px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0;
  box-shadow: inset 0 0 0 2px rgba(0,0,0,.18);
}
.swatch[aria-pressed=true] { border-color: var(--cream); box-shadow: 0 0 0 3px var(--felt), 0 0 0 5px var(--brass); }
.swatch:disabled { opacity: .2; cursor: not-allowed; }
.goals { display: grid; gap: 8px; }
.goal { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); cursor: pointer; }
.goal input { margin-top: 4px; accent-color: var(--brass); }
.goal small { display: block; color: var(--cream-dim); font-size: 13px; }
.games { display: grid; gap: 10px; }
.game-card {
  display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: center;
  padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,.14);
}
.game-card .code { font-family: var(--font-num); font-weight: 800; font-size: 22px; letter-spacing: .06em; text-transform: uppercase; }
.game-card .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--cream-dim); font-size: 13px; }
.state-pill { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
.state-pill.lobby { color: var(--brass); border-color: rgba(216,180,98,.5); }
.state-pill.playing { color: #9fd3b0; border-color: rgba(159,211,176,.45); }
.chip { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,.3); }
.empty { color: var(--cream-dim); padding: 18px; border: 1px dashed var(--line); border-radius: 12px; }
.note { font-size: 14px; color: var(--cream-dim); }
.note strong { color: var(--cream); }
.banner { padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(232,132,106,.45); color: var(--cream); background: rgba(232,132,106,.1); font-size: 14px; }
.rules ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.rules li::marker { font-family: var(--font-num); font-weight: 800; color: var(--brass); }
.cont-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.cont-table td { padding: 6px 0; border-bottom: 1px solid var(--line); }
.cont-table td:last-child { text-align: right; }

/* ---------- Game ---------- */
#game { height: 100%; display: flex; flex-direction: column; }
.bar {
  display: flex; align-items: center; gap: 10px; min-height: 54px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 6px; border-bottom: 1px solid var(--line); background: var(--felt);
}
.bar .brand { font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1; }
.bar .code { font-family: var(--font-num); font-weight: 800; letter-spacing: .08em; color: var(--cream-dim); text-transform: uppercase; }
.bar .spacer { flex: 1; }
.turn-chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 6px; border-radius: 999px; background: rgba(0,0,0,.25); font-weight: 600; font-size: 14px; min-width: 0; }
.turn-chip .dot { width: 18px; height: 18px; }
.turn-chip span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46vw; }
.board { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.mapwrap {
  position: relative; flex: 1 1 56%; min-height: 220px; overflow: hidden;
  background: radial-gradient(ellipse at 50% 42%, var(--felt-hi), var(--felt) 78%);
}
#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#map.dragging { cursor: grabbing; }
.zoom { position: absolute; right: calc(10px + env(safe-area-inset-right, 0px)); bottom: 10px; display: grid; gap: 6px; }
.zoom button {
  width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: rgba(16, 32, 22, .82);
  cursor: pointer; font-size: 20px; line-height: 1; display: grid; place-items: center;
}
.panel {
  flex: 0 1 auto; max-height: 46%; overflow: auto; border-top: 1px solid var(--line); background: var(--felt);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 18px; display: grid; gap: 16px; align-content: start;
}
@media (min-width: 900px) {
  .board { flex-direction: row; }
  .panel { width: 380px; flex: none; max-height: none; border-top: 0; border-left: 1px solid var(--line); padding-left: 18px; }
}
.orders { display: grid; gap: 12px; padding: 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
.orders .phase { display: flex; gap: 6px; }
.orders .phase span { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; color: var(--cream-dim); border: 1px solid var(--line); }
.orders .phase span.on { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); }
.orders h3 { font-size: 18px; font-weight: 700; }
.orders p { margin: 0; color: var(--cream-dim); font-size: 14px; }
.big-count { font-family: var(--font-num); font-weight: 800; font-size: 44px; line-height: 1; color: var(--brass); }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; text-align: center; }
.vs .side { padding: 8px; border-radius: 10px; background: rgba(0,0,0,.2); min-width: 0; }
.vs .side b { display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vs .side .num { font-size: 28px; }
.vs .x { font-family: var(--font-num); font-weight: 800; color: var(--cream-dim); }
input[type=range] { width: 100%; accent-color: var(--brass); }
.dice { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.dice .grp { display: flex; gap: 6px; }
.dice svg { width: 30px; height: 30px; }
.dice.roll svg { animation: shake .45s ease-out; }
@keyframes shake { 0% { transform: rotate(-25deg) scale(.7); } 60% { transform: rotate(12deg) scale(1.08); } 100% { transform: none; } }
.dice-caption { font-size: 13px; color: var(--cream-dim); }
.players { display: grid; gap: 6px; }
.prow { display: grid; grid-template-columns: 14px 1fr auto auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; font-size: 14px; }
.prow.current { background: rgba(216,180,98,.12); box-shadow: inset 0 0 0 1px rgba(216,180,98,.45); }
.prow.out { opacity: .45; text-decoration: line-through; }
.prow .dot { width: 14px; height: 14px; }
.prow .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.prow .name em { font-style: normal; font-weight: 500; color: var(--cream-dim); font-size: 12px; margin-left: 6px; }
.prow .stat { font-family: var(--font-num); font-weight: 800; font-size: 18px; text-align: right; min-width: 3ch; font-variant-numeric: tabular-nums; }
.prow .stat small { font-family: var(--font-body); font-weight: 500; font-size: 11px; color: var(--cream-dim); margin-left: 2px; }
.section-title { display: flex; justify-content: space-between; align-items: baseline; }
.conts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; font-size: 13px; }
.conts div { display: flex; justify-content: space-between; gap: 6px; padding: 6px 8px; border-radius: 8px; background: rgba(0,0,0,.16); align-items: center; }
.conts b { font-family: var(--font-num); font-size: 16px; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; color: var(--cream-dim); }
.log li { display: flex; gap: 6px; align-items: baseline; }
.log li .dot { width: 8px; height: 8px; transform: translateY(-1px); }
.log li b { color: var(--cream); font-weight: 600; }
.info-line { font-size: 13px; color: var(--cream-dim); }
.info-line b { color: var(--cream); }
.winner { text-align: center; display: grid; gap: 8px; padding: 18px; border-radius: 12px; border: 1px solid var(--brass); background: rgba(216,180,98,.1); }
.winner .title { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: .95; color: var(--brass); }

/* Map layers */
.terr { stroke: var(--felt); stroke-width: 1.2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.terr.can { cursor: pointer; }
.terr.dim, .badge.dim { opacity: .4; }
.hl { fill: none; vector-effect: non-scaling-stroke; pointer-events: none; stroke-linejoin: round; }
.hl.sel { stroke: var(--ink); stroke-width: 4; }
.hl.tgt { stroke: var(--ink); stroke-width: 2.5; stroke-dasharray: 6 4; }
.hl.hit { stroke: #fff; stroke-width: 3.5; animation: hit 1.2s ease-out forwards; }
@keyframes hit { from { stroke-opacity: 1; } to { stroke-opacity: 0; } }
.route { stroke: rgba(241, 232, 212, .45); stroke-width: 1.3; stroke-dasharray: 3 4; fill: none; vector-effect: non-scaling-stroke; pointer-events: none; }
.clname { font-family: var(--font-num); font-weight: 800; font-size: 10.5px; letter-spacing: .08em; text-anchor: middle; fill: var(--cream); pointer-events: none; }
.clbonus { font-family: var(--font-display); font-weight: 800; font-size: 22px; text-anchor: middle; pointer-events: none; }
.badge { cursor: pointer; }
.badge .pillbg { stroke: var(--felt); stroke-width: 2; }
.badge .pcount { font-family: var(--font-num); font-weight: 800; font-size: 13px; dominant-baseline: central; pointer-events: none; }
.badge .plus rect { fill: var(--brass); stroke: var(--felt); stroke-width: 1.5; }
.badge .plus text { fill: var(--brass-ink); font-family: var(--font-num); font-weight: 800; font-size: 11px; text-anchor: middle; dominant-baseline: central; }
.badge .tname { display: none; font-family: var(--font-body); font-weight: 600; font-size: 10px; text-anchor: middle; fill: var(--ink); stroke: rgba(255,255,255,.55); stroke-width: 2.5px; paint-order: stroke; pointer-events: none; }
#map.zoomed .badge .tname { display: block; }
.piece-key { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--cream-dim); align-items: center; }
.piece-key span { display: inline-flex; gap: 6px; align-items: center; }
.piece-key svg { width: 18px; height: 18px; }
.breakdown { display: grid; gap: 2px; font-size: 13px; color: var(--cream-dim); }
.breakdown div { display: flex; justify-content: space-between; gap: 10px; }
.breakdown b { font-family: var(--font-num); font-weight: 800; color: var(--cream); font-size: 15px; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--cream); color: var(--ink); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px;
  max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.35); z-index: 20;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

</head>
<body>
<section id="lobby"></section>
<section id="game" hidden></section>
<div class="toast" id="toast" role="status" hidden></div>

const enemyNb = (s, t) => ADJ[t].filter(n => s.owner[n] !== s.owner[t]);

    const pool = front.length ? front : mine;
    const d = {};
    if (!hard) {
      for (let i = 0; i < s.reinf; i++) { const t = pool[Math.floor(Math.random() * pool.length)]; d[t] = (d[t] || 0) + 1; }
    } else {
      let best = pool[0], bs = -1e9;

        const sc = s.troops[t] - s.troops[n] + 6 * contShare(s, MAP.t[n].c, p) + Math.random();
        if (sc > bs) { bs = sc; best = t; }
      }
      const main = Math.ceil(s.reinf * 0.7);
      d[best] = main;
      if (s.reinf > main) {

  }

      return;
    }
    let best = null, bs = -1e9;
    for (const a of mine) {
      if (s.troops[a] < 3) continue;
      for (const b of enemyNb(s, a)) {
        const diff = s.troops[a] - s.troops[b];
        if (diff < (hard ? 2 : 1 + Math.floor(Math.random() * 4))) continue;
        const sc = diff + (hard ? 8 : 2) * contShare(s, MAP.t[b].c, p) + (s.troops[b] === 1 ? 2 : 0) + Math.random();
        if (sc > bs) { bs = sc; best = [a, b]; }
      }
    }
    const done = s.botAtk || 0;
    if (best && done < (hard ? 30 : 8)) { s.botAtk = done + 1; attack(s, best[0], best[1], true, 2); return; }

  }

    const interior = mine.filter(t => !enemyNb(s, t).length && s.troops[t] > 1).sort((x, y) => s.troops[y] - s.troops[x]);
    for (const from of interior) {
      const r = [...reachable(s, from)].filter(t => enemyNb(s, t).length);
      if (r.length) { r.sort((x, y) => threat(s, y) - threat(s, x)); fortify(s, from, r[0], s.troops[from] - 1); return; }
    }

}

function errMsg(e) {

  if (c === 'invalid_argument') return 'No se pudo guardar la jugada.';

  if (c === 'resource_exhausted') return 'Demasiadas jugadas seguidas. Espera un momento.';

// Write the full game state (only the player whose turn it is writes during play).
function commit(fn) {
  if (!G || !db) return;
  const s = clone(G);
  fn(s);
  s.rev = (G.rev || 0) + 1; s.updatedAt = Date.now();
  G = s;
  renderGame();
  const ref = db.doc('games/' + GID);
  writeChain = writeChain.then(() => ref.set(s)).catch(e => {
    toast(errMsg(e));
    if (e && e.code === 'conflict') { forceSync = true; if (db.resync) db.resync(); }
  });
}
// Read-modify-write under a short lease, for lobby changes several people may make at once.
async function locked(id, fn) {
  const ref = db.doc('games/' + id);
  for (let i = 0; i < 8; i++) {
    try {
      const r = await ref.acquire({ holder: ME, ttlMs: 4000 });
      if (r.acquired) {
        const snap = await ref.get();
        const cur = snap.exists ? clone(snap.data()) : null;
        const next = fn(cur);
        if (next === 'delete') { await ref.delete(); return true; }
        if (next) { next.rev = ((cur && cur.rev) || 0) + 1; next.updatedAt = Date.now(); await ref.set(next); }
        return true;
      }
    } catch (e) {
      if (e && e.code === 'conflict') { await sleep(300 + Math.random() * 400); continue; }
      toast(errMsg(e)); return false;
    }
    await sleep(350 + Math.random() * 500);
  }
  toast('La sala está ocupada. Inténtalo de nuevo.');
  return false;
}

  };

function onTerr(id) {
  const s = G; if (!s) return;
  if (s.status !== 'playing' || !isMyTurn()) { ui.info = id; renderGame(); return; }
  const me = s.turn;
  if (s.phase === 'reinforce') {
    if (s.owner[id] !== me) { ui.info = id; renderGame(); return; }
    const used = Object.values(ui.draft).reduce((a, b) => a + b, 0);
    if (used >= s.reinf) { toast('Ya has colocado todas tus tropas. Confirma o deshaz.'); return; }
    ui.draft[id] = (ui.draft[id] || 0) + 1; ui.sel = id;
  } else if (s.phase === 'attack') {
    if (s.pendingMove) return;
    if (s.owner[id] === me) {
      if (s.troops[id] < 2) { toast(`${tname(id)} necesita al menos 2 tropas para atacar.`); return; }
      if (!ADJ[id].some(n => s.owner[n] !== me)) { toast(`${tname(id)} no tiene vecinos enemigos.`); return; }
      ui.sel = ui.sel === id ? null : id; ui.tgt = null;
    } else if (ui.sel && ADJ[ui.sel].includes(id)) {
      ui.tgt = id;
    } else { ui.info = id; if (ui.sel) toast(`${tname(id)} no es vecino de ${tname(ui.sel)}.`); }
  } else if (s.phase === 'fortify') {
    if (s.owner[id] !== me) { ui.info = id; renderGame(); return; }
    if (ui.sel && reachable(s, ui.sel).has(id)) { ui.fortTo = id; ui.fortN = Math.max(1, Math.floor((s.troops[ui.sel] - 1) / 2)); }
    else if (s.troops[id] > 1) { ui.sel = id; ui.fortTo = null; }
    else toast(`${tname(id)} solo tiene 1 tropa; elige otro origen.`);

}

  if (s.log && s.log.length) kids.push(h('div', { style: 'display:grid;gap:8px' }, h('span', { class: 'eyebrow' }, 'Crónica'), h('ul', { class: 'log' }, s.log.slice(0, 14).map(e => logLine(s, e)))));
  if (s.host === ME && CAN_WRITE) {
    kids.push(h('div', { class: 'row' }, ui.confirmDel
      ? [h('span', { class: 'note' }, 'Se borrará para todos.'), h('button', { class: 'btn small danger', onclick: async () => { try { await db.doc('games/' + GID).delete(); } catch (e) { toast(errMsg(e)); } goLobby(); } }, 'Sí, borrar'), h('button', { class: 'btn small', onclick: () => { ui.confirmDel = false; renderGame(); } }, 'Cancelar')]
      : h('button', { class: 'btn small danger', onclick: () => { ui.confirmDel = true; renderGame(); } }, 'Borrar partida')));
  }
  panel.replaceChildren(...kids);
  panel.scrollTop = scroll;
  paintMap();
  driveBots();
}

// The host's page plays the bots' turns, one visible step at a time.
let botTimer = null;
function stopBots() { clearTimeout(botTimer); botTimer = null; }
function driveBots() {
  if (botTimer || !G || G.status !== 'playing' || G.host !== ME || !CAN_WRITE) return;
  const cur = G.players[G.turn]; if (!cur || !cur.bot) return;
  const delay = G.phase === 'reinforce' ? 900 : G.phase === 'fortify' ? 700 : 850;
  const gid = GID;
  botTimer = setTimeout(() => {
    botTimer = null;
    if (!G || GID !== gid || G.status !== 'playing' || G.host !== ME || !G.players[G.turn].bot) return;
    commit(botStep);
  }, delay);
}

function openGame(id) {
  stopBots();
  if (unsubGame) unsubGame();
  GID = id; G = null; M = null;
  ui = { sel: null, tgt: null, draft: {}, info: null, moveN: null, fortTo: null, fortN: 1, lastSeq: 0, confirmDel: false };
  try { history.replaceState(null, '', '#p-' + id); } catch { location.hash = 'p-' + id; }
  document.getElementById('lobby').hidden = true;
  const root = document.getElementById('game'); root.hidden = false;
  document.body.classList.add('ingame');
  root.replaceChildren(h('div', { class: 'empty', style: 'margin:24px' }, 'Cargando la partida…'));
  let first = true;
  const timer = setTimeout(() => { if (!G) root.replaceChildren(h('div', { class: 'empty', style: 'margin:24px' }, 'No se puede conectar con la partida todavía. Revisa la conexión; seguirá intentándolo.', h('div', { style: 'margin-top:10px' }, h('button', { class: 'btn small', onclick: goLobby }, '← Volver')))); }, 10000);
  unsubGame = db.doc('games/' + id).onSnapshot(snap => {
    clearTimeout(timer);
    if (!snap.exists) { if (!snap.metadata.fromCache) { toast('Esa partida ya no existe.'); goLobby(); } return; }
    const d = clone(snap.data());
    if (d.owner && Object.keys(d.owner).some(t => !MAP.t[t])) { toast('Esta partida es de una versión anterior del mapa y ya no se puede abrir.'); goLobby(); return; }
    if (G && !forceSync && (d.rev || 0) < (G.rev || 0)) return;
    forceSync = false;
    const turnChanged = !G || G.turn !== d.turn || G.phase !== d.phase || G.status !== d.status;
    if (turnChanged) { ui.sel = null; ui.tgt = null; ui.fortTo = null; ui.draft = {}; ui.moveN = null; }
    if (first) { first = false; ui.lastSeq = d.lastRoll ? d.lastRoll.seq : 0; ui.firstSeq = ui.lastSeq; ui.paintSeq = ui.lastSeq; }
    G = d;
    if (!document.getElementById('g-panel')) M = null;
    renderGame();
  }, e => { clearTimeout(timer); toast(errMsg(e)); });
}

function goLobby() {
  stopBots();
  if (unsubGame) { unsubGame(); unsubGame = null; }
  G = null; GID = null; M = null;
  try { history.replaceState(null, '', location.pathname + location.search); } catch {}
  document.getElementById('game').hidden = true;
  document.getElementById('game').replaceChildren();
  document.body.classList.remove('ingame');
  document.getElementById('lobby').hidden = false;
  renderLobby();
}

// ===================== RENDER: LOBBY =====================
function joinForm(takenColors, onSubmit, label) {
  let color = +(store.get('heg-color') || 0);
  if (takenColors.includes(color)) color = [0, 1, 2, 3, 4].find(c => !takenColors.includes(c)) ?? 0;
  const input = h('input', { type: 'text', id: 'alias-' + label.length, maxlength: 16, placeholder: 'Ej.: Marc', value: store.get('heg-alias') || '', autocomplete: 'nickname', oninput: e => store.set('heg-alias', e.target.value) });
  const sw = h('div', { class: 'swatches', role: 'group', 'aria-label': 'Color del ejército' });
  const paint = () => [...sw.children].forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.c === color)));
  [0, 1, 2, 3, 4].forEach(c => sw.append(h('button', { type: 'button', class: 'swatch', 'data-c': c, style: `background:${pc(c)}`, 'aria-label': COLOR_NAMES[c], title: COLOR_NAMES[c], disabled: takenColors.includes(c), onclick: () => { color = c; store.set('heg-color', String(c)); paint(); } })));
  paint();
  const btn = h('button', { class: 'btn primary', type: 'submit' }, label);
  const form = h('form', { style: 'display:grid;gap:14px', onsubmit: async e => {
    e.preventDefault();
    const alias = input.value.trim().slice(0, 16);
    if (!alias) { toast('Escribe tu nombre de jugador.'); input.focus(); return; }
    store.set('heg-alias', alias); store.set('heg-color', String(color));
    btn.disabled = true;
    try { await onSubmit(alias, color); } finally { btn.disabled = false; }
  } },
    h('label', { class: 'field' }, 'Tu nombre de jugador', input),
    h('div', { class: 'field', style: 'display:grid;gap:6px;font-weight:600;font-size:14px' }, 'Color de tu ejército', sw),
    btn);
  form._extra = el => form.insertBefore(el, btn);
  return form;
}

function fillGames(gl) {
  gl.replaceChildren();
  const cnt = document.getElementById('games-count'); if (cnt) cnt.textContent = games.length ? String(games.length) : '';
  if (gamesState === 'loading') gl.append(h('div', { class: 'empty' }, 'Buscando partidas…'));
  else if (gamesState === 'slow') gl.append(h('div', { class: 'empty' }, 'No se puede conectar con las partidas todavía. Seguirá intentándolo.'));
  else if (gamesState === 'error') gl.append(h('div', { class: 'empty' }, 'No se pudieron cargar las partidas. Recarga la página.'));
  const shown = games.filter(g => !g.practice || (g.players || []).some(p => p.id === ME));
  if (cnt) cnt.textContent = shown.length ? String(shown.length) : '';
  if (gamesState === 'ready' && !shown.length) gl.append(h('div', { class: 'empty' }, 'Todavía no hay partidas. Crea la primera y tus amigos la verán aquí al abrir la página.'));
  for (const g of shown) {
    const st = g.status;
    const mine = (g.players || []).some(p => p.id === ME);
    const label = st === 'lobby' ? (mine ? 'Ir a la sala' : 'Unirse') : st === 'playing' ? (mine ? 'Jugar' : 'Mirar') : 'Ver final';
    const pill = { lobby: 'En sala', playing: `Ronda ${g.round || 1}`, ended: 'Terminada' }[st] || st;
    gl.append(h('div', { class: 'game-card' },
      h('div', { class: 'row' }, h('span', { class: 'code' }, '#' + g.code), h('span', { class: 'state-pill ' + st }, pill), g.practice ? h('span', { class: 'state-pill' }, 'Práctica') : null),
      h('button', { class: 'btn small' + (mine && st !== 'ended' ? ' primary' : ''), onclick: () => openGame(g.code) }, label),
      h('div', { class: 'meta' }, (g.players || []).map(p => h('span', { class: 'chip' }, h('span', { class: 'dot', style: `background:${pc(p.color)}` }), p.alias)),
        st === 'ended' && g.winner != null && g.players[g.winner] ? h('span', null, `Ganó ${g.players[g.winner].alias}`) : null)));
  }
}

function renderLobby() {
  const root = document.getElementById('lobby');
  const kids = [];
  kids.push(h('header', { class: 'hero' },
    h('div', { class: 'eyebrow' }, 'Estrategia por turnos · 2 a 5 jugadores'),
    h('h1', null, 'Hege', h('span', null, 'mo'), 'nía'),
    h('p', null, 'Reparte tus ejércitos, tira los dados y conquista el mundo con tus amigos o practica contra bots. Partidas rápidas, en directo, desde el ordenador o el móvil.'),
    heroMap()));
  if (!db || !ME) {
    kids.push(h('div', { class: 'banner' }, 'Para jugar tienes que abrir esta página con tu cuenta de Claude iniciada. Sin sesión no se pueden guardar ni ver las partidas.'));
    root.replaceChildren(...kids); return;
  }
  // create form
  const create = h('div', { class: 'sheet' }, h('h2', null, 'Nueva partida'));
  if (!CAN_WRITE) create.append(h('div', { class: 'banner' }, 'Tienes acceso solo de lectura. Para crear o unirte a partidas, el dueño de la página tiene que invitarte como Editor.'));
  else {
    let goal = 'dominio';
    const form = joinForm([], async (alias, color) => {
      const code = randomCode();
      const s = { code, createdAt: Date.now(), updatedAt: Date.now(), status: 'lobby', host: ME, goal, players: [{ id: ME, alias, color }], rev: 1, log: [] };
      try { await db.doc('games/' + code).set(s); openGame(code); } catch (e) { toast(errMsg(e)); }
    }, 'Crear partida');
    const goals = h('div', { class: 'goals', role: 'radiogroup', 'aria-label': 'Objetivo' },
      h('label', { class: 'goal' }, h('input', { type: 'radio', name: 'goal', id: 'goal-dominio', checked: true, onchange: () => { goal = 'dominio'; } }),
        h('span', null, 'Dominio', h('small', null, `Gana quien controle ${DOMINIO} de los ${TER.length} territorios. Unos 30–45 minutos.`))),
      h('label', { class: 'goal' }, h('input', { type: 'radio', name: 'goal', id: 'goal-total', onchange: () => { goal = 'total'; } }),
        h('span', null, 'Conquista total', h('small', null, 'Gana el último que quede en pie. Partida larga.'))));
    form._extra(h('div', { class: 'field', style: 'display:grid;gap:6px;font-weight:600;font-size:14px' }, 'Objetivo', goals));
    create.append(form);
  }
  // practice vs bots
  const practice = h('div', { class: 'sheet' }, h('h2', null, 'Practicar con bots'));
  if (CAN_WRITE) {
    let nb = 2, lvl = 'dificil';
    const opt = (name, id, label, checked, on) => h('label', { class: 'goal', style: 'padding:8px 12px' }, h('input', { type: 'radio', name, id, checked, onchange: on }), h('span', null, label));
    practice.append(
      h('p', { class: 'note' }, 'Una partida solo para ti contra la máquina. Los bots juegan sus turnos solos mientras tengas la partida abierta.'),
      h('div', { class: 'field', style: 'display:grid;gap:6px;font-weight:600;font-size:14px' }, 'Número de bots',
        h('div', { class: 'row', role: 'radiogroup', 'aria-label': 'Número de bots' }, [1, 2, 3, 4].map(n => opt('nbots', 'nbots-' + n, String(n), n === 2, () => { nb = n; })))),
      h('div', { class: 'field', style: 'display:grid;gap:6px;font-weight:600;font-size:14px' }, 'Dificultad',
        h('div', { class: 'row', role: 'radiogroup', 'aria-label': 'Dificultad' }, opt('lvl', 'lvl-facil', 'Fácil', false, () => { lvl = 'facil'; }), opt('lvl', 'lvl-dificil', 'Difícil', true, () => { lvl = 'dificil'; }))),
      h('button', { class: 'btn primary', onclick: async e => {
        e.target.disabled = true;
        const alias = (store.get('heg-alias') || '').trim().slice(0, 16) || 'Tú';
        const color = +(store.get('heg-color') || 0);
        const cols = [0, 1, 2, 3, 4].filter(c => c !== color);
        const players = [{ id: ME, alias, color }];
        for (let i = 0; i < nb; i++) players.push({ id: 'bot-' + randomCode(), alias: `${BOT_NAMES[i]} (bot)`, color: cols[i], bot: true, lvl });
        const code = randomCode();
        const st = { code, createdAt: Date.now(), updatedAt: Date.now(), status: 'lobby', host: ME, goal: 'dominio', practice: true, players, rev: 1, log: [] };
        startGame(st);
        try { await db.doc('games/' + code).set(st); openGame(code); } catch (err) { toast(errMsg(err)); e.target.disabled = false; }
      } }, 'Empezar práctica'));
  }
  create.append(h('p', { class: 'note' }, h('strong', null, 'Para invitar a tus amigos: '), 'crea la partida y pásales su enlace (está en la sala de espera). Solo tienen que abrirlo y escribir su nombre.'));

  // games list
  const list = h('div', { class: 'sheet' }, h('div', { class: 'section-title' }, h('h2', null, 'Partidas'), h('span', { class: 'eyebrow', id: 'games-count' }, games.length ? String(games.length) : '')));
  const gl = h('div', { class: 'games', id: 'games-list' });
  fillGames(gl);
  list.append(gl);

  const rules = h('div', { class: 'sheet rules' }, h('h2', null, 'Cómo se juega'),
    h('ol', null,
      h('li', null, 'El mapa se reparte al azar entre los jugadores, con tropas en cada territorio.'),
      h('li', null, h('b', null, 'Refuerzos: '), 'al empezar tu turno recibes 1 tropa por cada 3 territorios (mínimo 3), el bonus de cada continente que controles entero y +2 si conquistaste algo en tu turno anterior.'),
      h('li', null, h('b', null, 'Ataque: '), 'desde un territorio con 2 o más tropas, ataca a un vecino. El atacante tira hasta 3 dados y el defensor hasta 2; se comparan de mayor a menor y el empate lo gana quien defiende. Las líneas discontinuas son rutas por mar.'),
      h('li', null, h('b', null, 'Movimiento: '), 'un traslado de tropas entre territorios tuyos conectados, y se pasa el turno.'),
      h('li', null, h('b', null, 'Victoria: '), `controlar ${DOMINIO} de ${TER.length} territorios, o eliminar a todos en modo conquista total.`)),
    pieceKey(),
    h('table', { class: 'cont-table' }, h('tbody', null, Object.entries(CONT).map(([c, v]) =>
      h('tr', null, h('td', null, v.n), h('td', { class: 'note' }, `${TER.filter(t => MAP.t[t].c === c).length} territorios`), h('td', { class: 'num' }, '+' + v.b))))));

  kids.push(h('div', { class: 'lobby-grid' }, h('div', { style: 'display:grid;gap:20px;min-width:0' }, create, CAN_WRITE ? practice : null), h('div', { style: 'display:grid;gap:20px;min-width:0' }, list, rules)));
  root.replaceChildren(...kids);
}

// ===================== SERVER API (Cloudflare) =====================
function makeBackend() {
  const getId = () => {
    let id = store.get('heg-id');
    if (!id) {
      id = 'p_' + Array.from(crypto.getRandomValues(new Uint8Array(12)), b => (b % 36).toString(36)).join('');
      store.set('heg-id', id);
    }
    return id;
  };
  const req = async (method, path, body) => {
    let r;
    try {
      r = await fetch('/api/' + path, { method, cache: 'no-store', headers: body ? { 'content-type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
    } catch { throw { code: 'unavailable' }; }
    if (r.status === 204) return null;
    const j = await r.json().catch(() => ({}));
    if (r.status === 409) throw { code: 'conflict' };
    if (!r.ok) throw { code: 'unavailable', message: j.error };
    return j;
  };
  const polls = new Set();
  const snap = st => ({ exists: !!st, data: () => st, metadata: { fromCache: false, hasPendingWrites: false } });
  const doc = path => {
    const code = path.split('/')[1];
    return {
      async get() { const j = await req('GET', 'games/' + code); return snap(j && j.exists ? j.state : null); },
      set: st => req('PUT', 'games/' + code, { state: st, baseRev: (st.rev || 1) - 1 }),
      delete: () => req('DELETE', 'games/' + code),
      async acquire() { return { acquired: true }; },
      onSnapshot(next) {
        const p = { last: null, stop: false, fails: 0, timer: null };
        const tick = async () => {
          if (p.stop) return;
          try {
            const j = await req('GET', 'games/' + code + (p.last != null ? '?since=' + p.last : ''));
            if (j && !p.stop) { const st = j.exists ? j.state : null; p.last = st ? st.rev : -1; next(snap(st)); }
            if (p.fails >= 3) toast('Conexión recuperada.');
            p.fails = 0;
          } catch (e) { p.fails++; if (p.fails === 3) toast('Problemas de conexión. Sigo intentándolo…'); }
          if (!p.stop) p.timer = setTimeout(tick, document.hidden ? 5000 : 1200);
        };
        p.resync = () => { p.last = null; clearTimeout(p.timer); tick(); };
        polls.add(p); tick();
        return () => { p.stop = true; clearTimeout(p.timer); polls.delete(p); };
      },
    };
  };
  const collection = () => {
    const q = {
      orderBy: () => q, limit: () => q,
      onSnapshot(next, onErr) {
        let stop = false, t = null, ok = false;
        const tick = async () => {
          if (stop) return;
          try {
            const j = await req('GET', 'games'); ok = true;
            next({ docs: j.games.map(g => ({ data: () => g })), metadata: { fromCache: false } });
          } catch (e) { if (!ok && onErr) { onErr(e); } }
          if (!stop) t = setTimeout(tick, GID ? 20000 : 4000);
        };
        tick();
        return () => { stop = true; clearTimeout(t); };
      },
    };
    return q;
  };
  return {
    db: { doc, collection, resync: () => polls.forEach(p => p.resync()) },
    user: { id: async () => getId(), can: async () => true },
  };
}

// ===================== BOOT =====================
async function boot() {
  renderLobby();
  const be = makeBackend();
  db = be.db; user = be.user;
  ME = await user.id();
  CAN_WRITE = true;
  renderLobby();
  if (!db || !ME) return;
  const slow = setTimeout(() => { if (gamesState === 'loading') { gamesState = 'slow'; const gl = document.getElementById('games-list'); if (!GID && gl) fillGames(gl); } }, 10000);
  db.collection('games').orderBy('updatedAt', 'desc').limit(30).onSnapshot(snap => {
    if (!snap.metadata.fromCache) clearTimeout(slow);
    games = snap.docs.map(d => d.data()).filter(g => g && g.code);
    gamesState = 'ready';
    const gl = document.getElementById('games-list');
    if (!GID) { if (gl) fillGames(gl); else renderLobby(); }
  }, () => { clearTimeout(slow); gamesState = 'error'; if (!GID) renderLobby(); });
  const m = /^#p-([a-z0-9]{3,12})$/.exec(location.hash);
  if (m) openGame(m[1]);
}
boot();
</script>
